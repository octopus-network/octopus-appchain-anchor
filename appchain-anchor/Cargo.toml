[package]
name = "appchain-anchor"
version = "2.4.1"
authors = ["Octopus Network"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
beefy-light-client = { git = "https://github.com/octopus-network/beefy-light-client.git", branch = "upgrade-borsh" }
borsh = "1.5"
near-sdk = "5"
near-contract-standards = "5"
hex = "0.4.2"
getrandom = { version = "0.2", features = ["custom"] }
ed25519-dalek = { version = "1.0.1", features = ["alloc"] }
